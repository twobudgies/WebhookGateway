name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify (format, build, tests)
        run: make verify

  # Starts the real Compose stack from a clean state and runs the quick start and the sample tests against it.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start the stack
        run: docker compose up -d --build
      - name: Quick start (create tenant, send event, see it delivered and verified)
        run: ./scripts/quickstart.sh
      - name: Sample code against the running stack
        run: |
          ADMIN_KEY=$(docker compose exec -T controlplane sh -c '. /secrets/env; echo "$ControlPlane__AdminKey"' | tr -d '\r')
          TENANT=$(curl -fsS -H "X-Admin-Key: $ADMIN_KEY" -H 'content-type: application/json' -d '{"name":"ci","plan":"basic"}' localhost:8081/admin/v1/tenants | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          export WEBHOOKGATEWAY_API_KEY=$(curl -fsS -X POST -H "X-Admin-Key: $ADMIN_KEY" localhost:8081/admin/v1/tenants/$TENANT/api-keys | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')
          samples/test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
